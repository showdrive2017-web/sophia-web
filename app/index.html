<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0F22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SOPHIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --paper:#0A0F22;--surf:#111832;--surf2:#1A2344;--line:#232C4E;--line2:#3D4874;
  --ink:#E9E3D3;--ash:#A2AAC6;--ash2:#5F6A8E;--accent:#D8B565;--rec:#E06055;
  --sans:"Zen Kaku Gothic New",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 44%,rgba(0,0,0,0) 40%,rgba(3,6,16,.42) 75%,rgba(2,4,12,.72) 100%)}

/* ---- top bar ---- */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 10px;z-index:20;
  display:flex;align-items:center;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
#mark{font-family:Cinzel,Georgia,serif;font-size:12px;letter-spacing:.34em;color:var(--ink);opacity:.9;padding-left:.3em;flex:none}
#mark i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:9px;vertical-align:middle;box-shadow:0 0 8px var(--accent)}
#ttl{flex:0 1 auto;min-width:0;font-size:13px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;
  padding:8px 10px;border-radius:10px;border:1px dashed transparent;-webkit-touch-callout:none}
#ttl:active{border-color:var(--line2);background:rgba(17,24,50,.6)}
#modeBtn{margin-left:auto}
/* ---- projects: the open one sits right of the mark; the others, then ＋, wait under the mark as plain words ---- */
#projs{position:fixed;left:14px;top:calc(var(--sat) + 56px);z-index:19;display:flex;flex-direction:column;align-items:flex-start;
  pointer-events:none;opacity:0;transition:opacity .3s ease}
#projs.on{opacity:1}
#projs .pj{pointer-events:none;font-size:12.5px;letter-spacing:.06em;color:var(--ash2);padding:5px 6px;max-width:180px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 6px rgba(3,6,16,.95),0 0 2px rgba(3,6,16,.95);
  -webkit-touch-callout:none}
/* the words never take a touch themselves: the sky does, and a star under a name always comes first (see projAt) */
#projs .pj{transition:opacity .25s ease}
#projs .pj.over{opacity:.22}                     /* a name with a star under it steps back */
#projs .pj.add{font-size:16px;line-height:1;padding:4px 6px}
#projs .pj.fresh{animation:pjIn .5s ease both}
@keyframes pjIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
body.genesis.multi #ttl{opacity:1;pointer-events:auto}   /* an empty sky among several still says which one it is */
#sky{transition:opacity .22s ease}               /* a project change: the sky dims out and the next one comes up */
#ttlIn{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:rgba(17,24,50,.8);border:1px solid var(--accent);border-radius:10px;
  padding:8px 10px;outline:none;-webkit-user-select:text;user-select:text}
#modeBtn{height:42px;padding:0 16px 0 14px;border-radius:21px;background:rgba(17,24,50,.86);border:1px solid var(--accent);
  color:var(--accent);font-size:14px;letter-spacing:.08em;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);flex:none}
#modeBtn b{font-size:17px;font-weight:400;line-height:1}
#modeBtn:active{background:var(--surf2)}

/* ---- capture ---- */
#cap{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;padding:calc(var(--sat) + 68px) 0 0}
#cap.off{display:none}
#field{margin:0 18px;position:relative}
#txt{width:100%;min-height:96px;max-height:38vh;padding:14px 16px;border-radius:14px;resize:none;outline:none;
  background:rgba(17,24,50,.62);border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:17px;line-height:1.7;
  caret-color:var(--accent);-webkit-user-select:text;user-select:text;backdrop-filter:blur(10px);touch-action:manipulation}
#txt::placeholder{color:var(--ash2)}
#txt:focus{border-color:rgba(216,181,101,.6);box-shadow:0 0 0 3px rgba(216,181,101,.12)}
#fbar{display:flex;align-items:center;gap:10px;margin:10px 18px 0}
#mic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);color:var(--ash);font-size:18px;
  display:none;align-items:center;justify-content:center;background:rgba(17,24,50,.6)}
#mic.on{display:flex}
#mic.rec{color:var(--rec);border-color:var(--rec);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(224,96,85,.14)}50%{box-shadow:0 0 0 9px rgba(224,96,85,.04)}}
#hint{flex:1;font-size:11px;color:var(--ash2);letter-spacing:.04em}
#born{height:46px;padding:0 22px;border-radius:23px;background:var(--accent);color:#1A1406;font-weight:500;font-size:15px;
  letter-spacing:.1em;box-shadow:0 6px 24px rgba(216,181,101,.28)}
#born:disabled{opacity:.35;box-shadow:none}
#born:active{transform:scale(.97)}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:18px;padding:0 0 calc(var(--sab) + 90px);
  mask-image:linear-gradient(to bottom,transparent,#000 14px)}
#lh{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ash2);padding:6px 20px}
.row{position:relative;overflow:hidden;margin:0 12px 6px}
.rowIn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:rgba(17,24,50,.55);border:1px solid var(--line);transition:transform .12s;touch-action:pan-y;will-change:transform;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* a long press lifts a row; it follows the finger and the others make room */
#rows.dragging .row{transition:transform .16s ease}
#rows .row.lift{z-index:2;overflow:visible;transition:none}
.row.lift .rowIn{transform:scale(1.03);background:rgba(26,35,68,.94);border-color:var(--accent);box-shadow:0 12px 28px rgba(0,0,0,.5)}
.rowIn:active{background:rgba(26,35,68,.6)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.rowIn .dot{position:relative}
.rowIn .dot::before{content:'';position:absolute;top:-16px;bottom:-16px;left:-14px;right:-12px}   /* a fingertip-sized target: the row's whole left end changes the colour */
.rt{flex:1;min-width:0;font-size:15px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg{font-family:var(--mono);font-size:9.5px;color:var(--ash2);letter-spacing:.06em;flex:none}
#empty{padding:34px 28px;text-align:center;color:var(--ash2);font-size:13px;line-height:2}
#empty b{display:block;color:var(--ash);font-weight:400;font-size:14px}

/* ---- bottom tools ---- */
#tools{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:10px 14px calc(var(--sab) + 12px);
  display:flex;gap:8px;justify-content:center;background:linear-gradient(to top,rgba(10,15,34,.96),rgba(10,15,34,0))}
#tools.off{display:none}
.tb{padding:9px 14px;border-radius:20px;border:1px solid var(--line2);background:rgba(17,24,50,.7);font-size:12px;color:var(--ash);letter-spacing:.06em;backdrop-filter:blur(8px)}
.tb:active{color:var(--accent);border-color:var(--accent)}

/* ---- sky: the four faces ---- */
#faces{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 16px);z-index:12;display:none;justify-content:center;gap:14px;pointer-events:none}
#faces.on{display:flex}
#faces i{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:background .2s,transform .2s;display:block}
#faces i.on{background:var(--accent);transform:scale(1.35);box-shadow:0 0 8px var(--accent)}
#skyBtns{position:fixed;right:14px;bottom:calc(var(--sab) + 40px);z-index:13;display:none;gap:8px}
#skyBtns.on{display:flex}
#skyBtns .tb{padding:11px 18px;font-size:13.5px;border-radius:22px}   /* the sky's own buttons, a touch bigger than the inbox's */
body.genesis #skyBtns{display:none}
#summ{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.25,1);
  background:rgba(13,19,42,.97);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:14px 18px calc(var(--sab) + 14px);
  max-height:74vh;display:flex;flex-direction:column;backdrop-filter:blur(14px)}
#summ.open{transform:none}
#summHead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ash2);margin-bottom:8px}
#summOut{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;white-space:pre-wrap;font-size:14px;line-height:1.85;color:var(--ink);
  -webkit-user-select:text;user-select:text;margin-bottom:10px}
.sumFoot{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}
.sumFoot button{padding:8px 14px;border-radius:16px;border:1px solid var(--line2);font-size:13px;color:var(--ash)}
.sumFoot button.pri{color:var(--accent);border-color:var(--accent)}
.sumFoot button:disabled{opacity:.4}
.sumFoot{flex-wrap:wrap;row-gap:8px}.sumFoot button{white-space:nowrap}   /* longer words in other languages: a button never breaks in two, the row wraps instead */
/* ---- the purchase sheet: outside the universe, only when asked or at the tenth star ---- */
#buy{position:fixed;left:0;right:0;bottom:0;z-index:32;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.25,1);
  background:rgba(13,19,42,.97);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:14px 18px calc(var(--sab) + 14px);
  display:flex;flex-direction:column;backdrop-filter:blur(14px)}
#buy.open{transform:none}
#buyHead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ash2);margin-bottom:10px}
#buyTitle{font-size:19px;letter-spacing:.06em;color:var(--ink);margin-bottom:10px}
#buyMsg{white-space:pre-wrap;font-size:14px;line-height:1.85;color:var(--ash);margin-bottom:14px}
#buyPc{margin:-4px 0 14px}
#buyCodeBox{font-size:12px;color:var(--ash2);letter-spacing:.06em;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;margin-bottom:10px;
  -webkit-user-select:text;user-select:text}
#buyCodeBox b{display:block;font-family:var(--mono);font-size:17px;font-weight:400;letter-spacing:.12em;color:var(--accent);margin:4px 0 2px}
#buyCodeBox span{font-size:10.5px}
#buyPcLink,#buyPrivacy{font-size:12.5px;color:var(--ash);letter-spacing:.06em;text-decoration:none;border-bottom:1px solid var(--line2);padding-bottom:1px}
#buyPrivacy{margin-left:16px;font-size:11.5px;color:var(--ash2)}   /* 2.0: the stores ask for it inside the app too */
#skyHint{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 100px);   /* above 星を撮る・整頓, not under them */text-align:center;font-size:12px;color:var(--ash2);
  letter-spacing:.06em;pointer-events:none;z-index:11;opacity:0;transition:opacity .3s;text-shadow:0 0 12px #0A0F22;padding:0 30px}
#skyHint.on{opacity:1}
/* the first-run guide (2026-10-06): the first two lines float in the middle of the empty sky, written downwards;
   the rest sit where the sky's own hint does. Words only: nothing dims, nothing has to be pressed */
#guideV{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:11;
  opacity:0;transition:opacity 1.4s ease}
#guideV.on{opacity:1}
#guideV p{margin:0;writing-mode:vertical-rl;text-orientation:mixed;font-size:17px;line-height:2.1;letter-spacing:.24em;color:var(--ink);
  text-shadow:0 0 18px #0A0F22,0 0 6px #0A0F22;max-height:70vh}
html:not([lang=ja]) #guideV p{writing-mode:horizontal-tb;text-align:center;font-size:18px;line-height:1.7;letter-spacing:.03em;max-width:82vw}   /* other languages read across */
#guideB{position:fixed;left:0;right:0;top:calc(var(--sat) + 92px);   /* 2.0: at the top on the sky (the owner: hard to see at the foot) */text-align:center;font-size:15px;line-height:1.8;color:var(--ink);opacity:0;
  letter-spacing:.06em;pointer-events:none;z-index:11;transition:opacity .9s ease;text-shadow:0 0 14px #0A0F22,0 0 5px #0A0F22;padding:0 28px}
#guideB.on{opacity:.92}
/* 2.0 tips: taught where they live, once — the list's hold and swipe on a dark card at the foot; 「＋ 日付/時刻」 breathes gold the first times a paper opens */
#tipB{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 100px);z-index:11;text-align:center;font-size:14px;line-height:1.8;letter-spacing:.06em;color:var(--ink);
  padding:10px 18px;border-radius:14px;background:rgba(10,15,34,.9);border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .6s ease}
#tipB.on{opacity:.95}
@keyframes gBreathe{0%,100%{box-shadow:0 0 4px 0 rgba(216,181,101,.25)}50%{box-shadow:0 0 18px 3px rgba(216,181,101,.75)}}
.gGlow{animation:gBreathe 3s ease-in-out infinite;border-color:var(--accent)!important}
.row.gGlow .rowIn{border-color:rgba(216,181,101,.7)}
@keyframes gBlink{0%,100%{box-shadow:0 0 2px 0 rgba(246,214,140,.15);border-color:rgba(216,181,101,.45)}50%{box-shadow:0 0 22px 5px rgba(246,214,140,.95);border-color:#F6D68C}}
.gBlink{animation:gBlink 1.3s ease-in-out infinite}   /* the guide: write here, now */
@media (prefers-reduced-motion:reduce){.gBlink{animation:none;box-shadow:0 0 14px 2px rgba(246,214,140,.7);border-color:#F6D68C}}
@media (prefers-reduced-motion:reduce){.gGlow{animation:none;box-shadow:0 0 10px 1px rgba(216,181,101,.45)}}
#guideSkip{position:fixed;left:14px;bottom:calc(var(--sab) + 58px);   /* the left foot: 星を撮る・整頓 sit on the right */z-index:12;font-size:11px;letter-spacing:.12em;
  color:var(--ash2);padding:8px 14px;opacity:0;pointer-events:none;transition:opacity .9s ease}
#guideSkip.on{opacity:.8;pointer-events:auto}

/* ---- star sheet ---- */
.kbIOS #sheet{transition:transform .26s cubic-bezier(.2,.9,.25,1),bottom .26s cubic-bezier(.2,.9,.25,1)}   /* iOS アプリ：キーボードと一緒にせり上がる */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.25,1);
  background:rgba(13,19,42,.96);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
  padding:12px 18px calc(var(--sab) + 14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;max-height:56vh}
#sheet.open{transform:none}
#shBar{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}
#shTitle{width:100%;font:inherit;font-size:19px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);
  padding:6px 0 8px;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#shTitle:focus{border-color:var(--accent)}
#shBody{min-height:96px;margin-top:10px;font:inherit;font-size:15px;line-height:1.75;color:var(--ink);background:rgba(10,15,34,.5);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;resize:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#shBody:focus{border-color:var(--accent)}
#shRow{display:flex;flex-wrap:wrap;gap:8px;row-gap:12px;align-items:center;margin-top:10px}
#shColors{display:flex;gap:min(9px,1.6vw);flex:1 0 auto}
#shColors .sw{width:min(24px,5.8vw);height:min(24px,5.8vw);flex:none}   /* narrow phones (360px): the colours give way, 消す・閉じる stay on one line */
#shBtns{display:flex;gap:8px;margin-left:auto}#shBtns>button{white-space:nowrap;flex:none}
/* longer words (Löschen · Schließen): the two buttons drop to their own line together, at the right */
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 8px currentColor}
.sw.on{border-color:#fff}
.sw.none{background:#5F6A8E;box-shadow:none}
#shDel,.shDel{color:var(--rec);font-size:12px;padding:8px 10px;border:1px solid rgba(224,96,85,.4);border-radius:16px}
#shClose{color:var(--ash);font-size:12px;padding:8px 12px;border:1px solid var(--line2);border-radius:16px}
#shLinks{margin-top:8px;font-size:12px;color:var(--ash2);line-height:1.8;max-height:12vh;overflow-y:auto}
#shLinks .lk{display:flex;align-items:center;gap:6px}
#shLinks span{color:var(--ash);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#shLinks .x{position:relative;flex:none;color:var(--ash2);font-family:var(--mono);font-size:13px;line-height:1;padding:2px 6px}
#shLinks .x::before{content:'';position:absolute;inset:-8px -10px}   /* a fingertip-sized target around the small × */
#shLinks .x:active{color:var(--rec)}
#shMini{display:none;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:10px}   /* the small paper: write more in the middle, let it go at the right */
#shMini #shMore{grid-column:2;font-size:13.5px;padding:8px 18px;border-radius:16px}
#shDelMini{grid-column:3;justify-self:end}
#shMore{font-size:12px;color:var(--ash);letter-spacing:.08em;padding:6px 14px;border-radius:14px;border:1px solid var(--line2)}   /* 2.0: the same tone as 「＋ 日付/時刻」 */
#sheet.compact #shBody,#sheet.compact #shLinks,#sheet.compact #shRow{display:none}   /* the small paper: name, date, write, delete (lines are cut on the sky; the big paper lists them with ×) */
#sheet.compact #shMini{display:grid}
/* the star's date (2026-10-20): a small 「日付」 at the name's right end opens a dial like a safe's — year · month · day drums */
#shTRow{display:flex;align-items:center;gap:10px;padding-bottom:4px}
#shTRow #shTitle{flex:1;min-width:0;border:1px solid var(--line2);border-radius:13px;padding:6px 12px 7px}   /* 2.0 (the owner): the name sits in a frame like 「＋ 日付/時刻」, so a first-timer sees where to write */
#shTRow #shTitle:focus{border-color:var(--accent)}
#shDate{position:relative;flex:none;font-size:12.5px;letter-spacing:.12em;color:var(--ash);border:1px solid var(--line2);border-radius:13px;padding:5px 12px;white-space:nowrap}
#shDate::before{content:'';position:absolute;inset:-10px -8px}   /* a fingertip around it */
#shDate.set{font-family:var(--mono);letter-spacing:.08em;color:var(--accent);border-color:rgba(216,181,101,.55);background:rgba(216,181,101,.06)}
#shDate.open{font-family:var(--mono);letter-spacing:.08em;color:var(--accent);border-color:var(--accent)}
#shDial{display:none;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:rgba(8,12,28,.72);padding:10px 10px 12px}
#dTabs{display:flex;gap:2px;width:max-content;margin:0 auto 10px;border:1px solid var(--line);border-radius:12px;padding:2px}
#dTabs button{font-size:12.5px;letter-spacing:.08em;color:var(--ash);padding:5px 16px;border-radius:10px}
#dTabs button.on{background:rgba(216,181,101,.12);color:var(--accent)}
#tDot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle;opacity:0}
#tDot.on{opacity:.9}
#dViews{display:grid}#dViews>.wheels{grid-area:1/1}#dViews>.off{visibility:hidden;pointer-events:none}   /* both stay laid out: a hidden drum would forget where it was */
#shDial .sep{align-self:flex-start;height:calc(32px*5);display:flex;align-items:center;font-family:var(--mono);font-size:20px;color:rgba(216,181,101,.7)}
#shDial .sep.off{opacity:.28}
.drum.off{cursor:pointer}
#sheet.dialing #shDial{display:block}
#sheet.dialing #shBody,#sheet.dialing #shLinks,#sheet.dialing #shRow,#sheet.dialing #shMini{display:none}
#shDial .wheels{display:flex;justify-content:center;gap:12px}
#shDial .col{display:flex;flex-direction:column;align-items:center;gap:6px}
.drum{--it:32px;position:relative;width:62px;height:calc(var(--it)*5);border-radius:10px;overflow:hidden;touch-action:pan-y;
  background:linear-gradient(180deg,#070b1b 0%,#18203f 50%,#070b1b 100%);
  box-shadow:inset 0 0 0 1px rgba(61,72,116,.6),inset 0 12px 16px rgba(0,0,0,.65),inset 0 -12px 16px rgba(0,0,0,.65)}
.drum.y{width:84px}
.drum::after{content:'';position:absolute;left:4px;right:4px;top:calc(var(--it)*2);height:var(--it);
  border-top:1px solid rgba(216,181,101,.38);border-bottom:1px solid rgba(216,181,101,.38);pointer-events:none}
.drum.off{opacity:.28}.drum.off::after{opacity:0}
.reel{position:absolute;inset:0;overflow-x:hidden;overflow-y:scroll;touch-action:pan-y;scroll-snap-type:y mandatory;scrollbar-width:none;
  overscroll-behavior:contain;padding:calc(var(--it)*2) 0;perspective:260px;-webkit-overflow-scrolling:touch}
.reel::-webkit-scrollbar{display:none}
.reel div{width:100%;overflow:hidden;height:var(--it);line-height:var(--it);text-align:center;scroll-snap-align:center;
  font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;color:rgba(162,170,198,.42)}
.reel div.c{color:var(--accent);text-shadow:0 0 10px rgba(216,181,101,.45)}
.reel div.no{color:rgba(95,106,142,.25)}
#shDial .cap{font-size:11.5px;letter-spacing:.14em;color:var(--ash)}
#noYear{font-size:11.5px;letter-spacing:.04em;color:var(--ash);border:1px solid var(--line2);border-radius:10px;padding:4px 9px;white-space:nowrap}
#noYear.on{color:var(--accent);border-color:rgba(216,181,101,.6);background:rgba(216,181,101,.08)}
#shDial .drow{display:flex;align-items:center;gap:8px;margin-top:12px}#shDial .drow .sp{flex:1}
#dClear,#dCancel{font-size:12.5px;color:var(--ash);padding:7px 12px;border:1px solid var(--line2);border-radius:14px;white-space:nowrap}
#dOk{font-size:13px;color:var(--accent);padding:8px 20px;border:1px solid var(--accent);border-radius:16px}
/* the list: the star's own date at the right in gold; 「自分の順／日付順」 beside the counts */
#lh{display:flex;align-items:center;gap:8px}
#lhSort{margin-left:auto;display:flex;gap:2px;border:1px solid var(--line);border-radius:12px;padding:2px;font-family:var(--sans);font-size:11px;letter-spacing:.04em}
#lhSort button{padding:3px 9px;border-radius:10px;color:var(--ash2)}
#lhSort button.on{background:rgba(216,181,101,.12);color:var(--accent)}
.rg.dated{font-size:11px;letter-spacing:.06em;color:rgba(216,181,101,.88)}

/* ---- confirm / toast ---- */
#ask{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;display:none;min-width:250px;max-width:86vw;
  background:rgba(13,19,42,.97);border:1px solid var(--line2);border-radius:14px;padding:16px 18px 12px}
#ask.open{display:block}
#askMsg{font-size:14px;line-height:1.7;margin-bottom:12px;white-space:pre-line}
#askBtns{display:flex;gap:8px;justify-content:flex-end}
#askBtns button{padding:8px 14px;border-radius:16px;border:1px solid var(--line2);font-size:13px;color:var(--ash)}
#askYes{color:var(--rec)!important;border-color:var(--rec)!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 84px);z-index:50;display:none;
  background:rgba(233,227,211,.94);color:#0A0F22;font-size:12.5px;padding:9px 16px;border-radius:16px;max-width:86vw;text-align:center}
#toast.on{display:block}
#dbg{position:fixed;left:8px;top:calc(var(--sat) + 60px + var(--vvTop,0px));z-index:60;font:10px var(--mono);color:#9ad;pointer-events:none;white-space:pre}
#file{display:none}
#ttl,#modeBtn,#faces,#tools,#cap{transition:opacity .9s ease}
body.genesis #ttl,body.genesis #modeBtn,body.genesis #faces,body.genesis #skyHint{opacity:0;pointer-events:none}
body.genesis #tools,body.genesis #cap{display:none}

/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:200;background:#0b1a25;display:flex;align-items:center;justify-content:center;transition:opacity .63s ease}
#splash.out{opacity:0;pointer-events:none}#splash.gone{display:none}
#spSky{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:spSky 1s ease .03s both}
@keyframes spSky{to{opacity:1}}
#spName{position:relative;font-family:Cinzel,Georgia,serif;font-size:20px;letter-spacing:.42em;color:#EEF3F6;opacity:0;
  animation:spName .9s ease .63s both;padding-left:.42em;text-shadow:0 0 18px rgba(170,205,225,.45)}
@keyframes spName{from{opacity:0;letter-spacing:.7em}to{opacity:.92;letter-spacing:.42em}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="vig"></div>

<div id="top">
  <div id="mark"><i></i>SOPHIA</div>
  <div id="ttl" data-t-title="rename"></div>
  <input id="ttlIn" style="display:none" autocapitalize="off" autocomplete="off">
  <button id="modeBtn"><b>✦</b><span data-t="sky"></span></button>
</div>
<div id="projs"></div>

<div id="cap">
  <div id="field">
    <textarea id="txt" rows="3" data-t-ph="placeholder" autocapitalize="off" autocomplete="off"></textarea>
  </div>
  <div id="fbar">
    <button id="mic" data-t-title="voice">●</button>
    <div id="hint"></div>
    <button id="born" disabled data-t="born"></button>
  </div>
  <div id="list">
    <div id="lh"><span id="lhN"></span><div id="lhSort"><button id="sMine" data-t="sortMine"></button><button id="sDate" data-t="sortDate"></button></div></div>
    <div id="rows"></div>
    <div id="empty"><b data-t="emptyHead"></b><span data-t="emptyBody"></span><br><br><span data-t="emptyHow"></span></div>
  </div>
</div>
<div id="tools">
  <button class="tb" id="bExport" data-t="export"></button>
  <button class="tb" id="bImport" data-t="import"></button>
  <button class="tb" id="bSound">♪</button>
  <button class="tb" id="bConf" style="display:none" data-t="settings"></button>
</div>

<div id="skyHint"></div>
<div id="guideV"><p></p></div><div id="guideB"></div><div id="tipB"></div><button id="guideSkip" data-t="skipGuide"></button>
<div id="faces"><i></i><i></i><i></i><i></i></div>
<div id="skyBtns">
  <button class="tb" id="bShareT" style="display:none" data-t="share"></button>
  <button class="tb" id="bSumm" style="display:none" data-t="summary"></button>
  <button class="tb" id="bShot" data-t="shot"></button>
  <button class="tb" id="bTidy" data-t="tidy"></button>
</div>
<div id="summ">
  <div id="summHead"><span data-t="summary"></span>　<span id="summSub"></span></div>
  <div id="summOut"></div>
  <div class="sumFoot"><button id="summShare" class="pri" data-t="share"></button><button id="summCopy" data-t="copy"></button><button id="summClose" data-t="close"></button></div>
</div>
<div id="buy">
  <div id="buyHead">SOPHIA</div>
  <div id="buyTitle"></div>
  <div id="buyMsg"></div>
  <div id="buyPc"><div id="buyCodeBox" style="display:none"><span data-t="pcCode"></span><b id="buyCode"></b><span data-t="tapCopy"></span></div>
    <a id="buyPcLink" href="https://sophia-universe.com/pc/" target="_blank" rel="noopener" data-t="pcDownload"></a>
    <a id="buyPrivacy" href="https://showdrive2017-web.github.io/sophia-legal/" target="_blank" rel="noopener" data-t="privacy"></a>
    <a id="buyGuide" href="#" data-t="guideAgain" style="display:none"></a></div>
  <div class="sumFoot"><button id="buyRestore" data-t="restore"></button><span style="flex:1"></span><button id="buyClose" data-t="later"></button><button id="buyGo" class="pri" data-t="buy"></button></div>
</div>

<div id="sheet">
  <div id="shBar"></div>
  <div id="shTRow"><input id="shTitle" data-t-ph="starName" autocapitalize="off" autocomplete="off"><button id="shDate"></button></div>
  <div id="shDial">
    <div id="dTabs"><button id="tabD" data-t="dateBtn"></button><button id="tabT"><span data-t="tabTime"></span><i id="tDot"></i></button></div>
    <div id="dViews">
      <div class="wheels" id="wDate">
        <div class="col"><div class="drum y" id="dY"><div class="reel" id="rY"></div></div><button id="noYear" data-t="noYear"></button></div>
        <div class="col"><div class="drum" id="dM"><div class="reel" id="rM"></div></div><span class="cap" data-t="capM"></span></div>
        <div class="col"><div class="drum" id="dD"><div class="reel" id="rD"></div></div><span class="cap" data-t="capD"></span></div>
      </div>
      <div class="wheels off" id="wTime">
        <div class="col"><div class="drum" id="dH"><div class="reel" id="rH"></div></div><span class="cap" data-t="capH"></span></div>
        <div class="sep" id="dSep">:</div>
        <div class="col"><div class="drum" id="dMi"><div class="reel" id="rMi"></div></div><span class="cap" data-t="capMi"></span></div>
      </div>
    </div>
    <div class="drow"><button id="dClear"></button><span class="sp"></span><button id="dCancel" data-t="dialCancel"></button><button id="dOk" data-t="dateSet"></button></div>
  </div>
  <div id="shMini"><button id="shMore" data-t="writeAbout"></button><button id="shDelMini" class="shDel" data-t="del"></button></div>
  <textarea id="shBody" rows="3" data-t-ph="aboutStar"></textarea>
  <div id="shLinks"></div>
  <div id="shRow">
    <div id="shColors"></div>
    <div id="shBtns"><button id="shDel" data-t="del"></button><button id="shClose" data-t="close"></button></div>
  </div>
</div>

<div id="ask"><div id="askMsg"></div><div id="askBtns"><button id="askNo" data-t="cancel"></button><button id="askYes" data-t="del"></button></div></div>
<div id="toast"></div>
<div id="dbg"></div>
<input type="file" id="file" accept=".json,application/json">
