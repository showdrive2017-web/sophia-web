<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0F22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SOPHIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --paper:#0A0F22;--surf:#111832;--surf2:#1A2344;--line:#232C4E;--line2:#3D4874;
  --ink:#E9E3D3;--ash:#A2AAC6;--ash2:#5F6A8E;--accent:#D8B565;--rec:#E06055;
  --sans:"Zen Kaku Gothic New",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 44%,rgba(0,0,0,0) 40%,rgba(3,6,16,.42) 75%,rgba(2,4,12,.72) 100%)}

/* ---- top bar ---- */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 10px;z-index:20;
  display:flex;align-items:center;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
#mark{font-family:Cinzel,Georgia,serif;font-size:12px;letter-spacing:.34em;color:var(--ink);opacity:.9;padding-left:.3em;flex:none}
#mark i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:9px;vertical-align:middle;box-shadow:0 0 8px var(--accent)}
#ttl{flex:1;min-width:0;font-size:13px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;
  padding:8px 10px;border-radius:10px;border:1px dashed transparent}
#ttl:active{border-color:var(--line2);background:rgba(17,24,50,.6)}
#ttlIn{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:rgba(17,24,50,.8);border:1px solid var(--accent);border-radius:10px;
  padding:8px 10px;outline:none;-webkit-user-select:text;user-select:text}
#modeBtn{height:42px;padding:0 16px 0 14px;border-radius:21px;background:rgba(17,24,50,.86);border:1px solid var(--accent);
  color:var(--accent);font-size:14px;letter-spacing:.08em;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);flex:none}
#modeBtn b{font-size:17px;font-weight:400;line-height:1}
#modeBtn:active{background:var(--surf2)}

/* ---- capture ---- */
#cap{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;padding:calc(var(--sat) + 68px) 0 0}
#cap.off{display:none}
#field{margin:0 18px;position:relative}
#txt{width:100%;min-height:96px;max-height:38vh;padding:14px 16px;border-radius:14px;resize:none;outline:none;
  background:rgba(17,24,50,.62);border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:17px;line-height:1.7;
  caret-color:var(--accent);-webkit-user-select:text;user-select:text;backdrop-filter:blur(10px);touch-action:manipulation}
#txt::placeholder{color:var(--ash2)}
#txt:focus{border-color:rgba(216,181,101,.6);box-shadow:0 0 0 3px rgba(216,181,101,.12)}
#fbar{display:flex;align-items:center;gap:10px;margin:10px 18px 0}
#mic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);color:var(--ash);font-size:18px;
  display:none;align-items:center;justify-content:center;background:rgba(17,24,50,.6)}
#mic.on{display:flex}
#mic.rec{color:var(--rec);border-color:var(--rec);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(224,96,85,.14)}50%{box-shadow:0 0 0 9px rgba(224,96,85,.04)}}
#hint{flex:1;font-size:11px;color:var(--ash2);letter-spacing:.04em}
#born{height:46px;padding:0 22px;border-radius:23px;background:var(--accent);color:#1A1406;font-weight:500;font-size:15px;
  letter-spacing:.1em;box-shadow:0 6px 24px rgba(216,181,101,.28)}
#born:disabled{opacity:.35;box-shadow:none}
#born:active{transform:scale(.97)}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:18px;padding:0 0 calc(var(--sab) + 90px);
  mask-image:linear-gradient(to bottom,transparent,#000 14px)}
#lh{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ash2);padding:6px 20px}
.row{position:relative;overflow:hidden;margin:0 12px 6px}
.rowIn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:rgba(17,24,50,.55);border:1px solid var(--line);transition:transform .12s;touch-action:pan-y;will-change:transform}
.rowIn:active{background:rgba(26,35,68,.6)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.rt{flex:1;min-width:0;font-size:15px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg{font-family:var(--mono);font-size:9.5px;color:var(--ash2);letter-spacing:.06em;flex:none}
#empty{padding:34px 28px;text-align:center;color:var(--ash2);font-size:13px;line-height:2}
#empty b{display:block;color:var(--ash);font-weight:400;font-size:14px}

/* ---- bottom tools ---- */
#tools{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:10px 14px calc(var(--sab) + 12px);
  display:flex;gap:8px;justify-content:center;background:linear-gradient(to top,rgba(10,15,34,.96),rgba(10,15,34,0))}
#tools.off{display:none}
.tb{padding:9px 14px;border-radius:20px;border:1px solid var(--line2);background:rgba(17,24,50,.7);font-size:12px;color:var(--ash);letter-spacing:.06em;backdrop-filter:blur(8px)}
.tb:active{color:var(--accent);border-color:var(--accent)}

/* ---- sky: the four faces ---- */
#faces{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 16px);z-index:12;display:none;justify-content:center;gap:14px;pointer-events:none}
#faces.on{display:flex}
#faces i{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:background .2s,transform .2s;display:block}
#faces i.on{background:var(--accent);transform:scale(1.35);box-shadow:0 0 8px var(--accent)}
#skyBtns{position:fixed;right:14px;bottom:calc(var(--sab) + 40px);z-index:13;display:none;gap:8px}
#skyBtns.on{display:flex}
body.genesis #skyBtns{display:none}
#summ{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.25,1);
  background:rgba(13,19,42,.97);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:14px 18px calc(var(--sab) + 14px);
  max-height:74vh;display:flex;flex-direction:column;backdrop-filter:blur(14px)}
#summ.open{transform:none}
#summHead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ash2);margin-bottom:8px}
#summOut{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;white-space:pre-wrap;font-size:14px;line-height:1.85;color:var(--ink);
  -webkit-user-select:text;user-select:text;margin-bottom:10px}
.sumFoot{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}
.sumFoot button{padding:8px 14px;border-radius:16px;border:1px solid var(--line2);font-size:13px;color:var(--ash)}
.sumFoot button.pri{color:var(--accent);border-color:var(--accent)}
.sumFoot button:disabled{opacity:.4}
/* ---- the purchase sheet: outside the universe, only when asked or at the tenth star ---- */
#buy{position:fixed;left:0;right:0;bottom:0;z-index:32;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.25,1);
  background:rgba(13,19,42,.97);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:14px 18px calc(var(--sab) + 14px);
  display:flex;flex-direction:column;backdrop-filter:blur(14px)}
#buy.open{transform:none}
#buyHead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ash2);margin-bottom:10px}
#buyTitle{font-size:19px;letter-spacing:.06em;color:var(--ink);margin-bottom:10px}
#buyMsg{white-space:pre-wrap;font-size:14px;line-height:1.85;color:var(--ash);margin-bottom:14px}
#skyHint{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 40px);text-align:center;font-size:12px;color:var(--ash2);
  letter-spacing:.06em;pointer-events:none;z-index:11;opacity:0;transition:opacity .3s;text-shadow:0 0 12px #0A0F22;padding:0 30px}
#skyHint.on{opacity:1}

/* ---- star sheet ---- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.25,1);
  background:rgba(13,19,42,.96);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
  padding:12px 18px calc(var(--sab) + 14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;max-height:56vh}
#sheet.open{transform:none}
#shBar{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}
#shTitle{width:100%;font:inherit;font-size:19px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);
  padding:6px 0 8px;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#shTitle:focus{border-color:var(--accent)}
#shBody{min-height:96px;margin-top:10px;font:inherit;font-size:15px;line-height:1.75;color:var(--ink);background:rgba(10,15,34,.5);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;resize:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#shBody:focus{border-color:var(--accent)}
#shRow{display:flex;gap:8px;align-items:center;margin-top:10px}
#shColors{display:flex;gap:9px;flex:1}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 8px currentColor}
.sw.on{border-color:#fff}
.sw.none{background:#5F6A8E;box-shadow:none}
#shDel{color:var(--rec);font-size:12px;padding:8px 10px;border:1px solid rgba(224,96,85,.4);border-radius:16px}
#shClose{color:var(--ash);font-size:12px;padding:8px 12px;border:1px solid var(--line2);border-radius:16px}
#shLinks{margin-top:8px;font-size:12px;color:var(--ash2);line-height:1.8;max-height:12vh;overflow-y:auto}
#shLinks span{color:var(--ash)}
#shMore{display:none;margin:10px auto 0;font-size:12px;color:var(--ash2);letter-spacing:.08em;padding:6px 14px;border-radius:14px;border:1px solid var(--line)}
#sheet.compact #shBody,#sheet.compact #shLinks,#sheet.compact #shRow{display:none}
#sheet.compact #shMore{display:block}

/* ---- confirm / toast ---- */
#ask{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;display:none;min-width:250px;max-width:86vw;
  background:rgba(13,19,42,.97);border:1px solid var(--line2);border-radius:14px;padding:16px 18px 12px}
#ask.open{display:block}
#askMsg{font-size:14px;line-height:1.7;margin-bottom:12px}
#askBtns{display:flex;gap:8px;justify-content:flex-end}
#askBtns button{padding:8px 14px;border-radius:16px;border:1px solid var(--line2);font-size:13px;color:var(--ash)}
#askYes{color:var(--rec)!important;border-color:var(--rec)!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 84px);z-index:50;display:none;
  background:rgba(233,227,211,.94);color:#0A0F22;font-size:12.5px;padding:9px 16px;border-radius:16px;max-width:86vw;text-align:center}
#toast.on{display:block}
#dbg{position:fixed;left:8px;top:calc(var(--sat) + 60px + var(--vvTop,0px));z-index:60;font:10px var(--mono);color:#9ad;pointer-events:none;white-space:pre}
#file{display:none}
#ttl,#modeBtn,#faces,#tools,#cap{transition:opacity .9s ease}
body.genesis #ttl,body.genesis #modeBtn,body.genesis #faces,body.genesis #skyHint{opacity:0;pointer-events:none}
body.genesis #tools,body.genesis #cap{display:none}

/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:200;background:#0b1a25;display:flex;align-items:center;justify-content:center;transition:opacity .63s ease}
#splash.out{opacity:0;pointer-events:none}#splash.gone{display:none}
#spSky{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:spSky 1s ease .03s both}
@keyframes spSky{to{opacity:1}}
#spName{position:relative;font-family:Cinzel,Georgia,serif;font-size:20px;letter-spacing:.42em;color:#EEF3F6;opacity:0;
  animation:spName .9s ease .63s both;padding-left:.42em;text-shadow:0 0 18px rgba(170,205,225,.45)}
@keyframes spName{from{opacity:0;letter-spacing:.7em}to{opacity:.92;letter-spacing:.42em}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="vig"></div>

<div id="top">
  <div id="mark"><i></i>SOPHIA</div>
  <div id="ttl" title="タップで名前を変える"></div>
  <input id="ttlIn" style="display:none" autocapitalize="off" autocomplete="off">
  <button id="modeBtn"><b>✦</b><span>星空</span></button>
</div>

<div id="cap">
  <div id="field">
    <textarea id="txt" rows="3" placeholder="ハッとしたことを、そのまま。" autocapitalize="off" autocomplete="off"></textarea>
  </div>
  <div id="fbar">
    <button id="mic" title="声で書く">●</button>
    <div id="hint"></div>
    <button id="born" disabled>生む</button>
  </div>
  <div id="list">
    <div id="lh"></div>
    <div id="rows"></div>
    <div id="empty"><b>ここは、あなたの受信箱。</b>思いついたことを書いて「生む」。<br>星になって、待っていてくれます。<br><br>星は横に払って色を変えられます。</div>
  </div>
</div>
<div id="tools">
  <button class="tb" id="bExport">書き出す</button>
  <button class="tb" id="bImport">読み込む</button>
  <button class="tb" id="bSound">♪</button>
  <button class="tb" id="bConf" style="display:none">設定</button>
</div>

<div id="skyHint"></div>
<div id="faces"><i></i><i></i><i></i><i></i></div>
<div id="skyBtns">
  <button class="tb" id="bShareT" style="display:none">シェア</button>
  <button class="tb" id="bSumm" style="display:none">要約</button>
  <button class="tb" id="bTidy">整頓</button>
</div>
<div id="summ">
  <div id="summHead">要約　<span id="summSub"></span></div>
  <div id="summOut"></div>
  <div class="sumFoot"><button id="summShare" class="pri">シェア</button><button id="summCopy">コピー</button><button id="summClose">閉じる</button></div>
</div>
<div id="buy">
  <div id="buyHead">SOPHIA</div>
  <div id="buyTitle"></div>
  <div id="buyMsg"></div>
  <div class="sumFoot"><button id="buyRestore">購入を復元</button><span style="flex:1"></span><button id="buyClose">あとで</button><button id="buyGo" class="pri">購入する</button></div>
</div>

<div id="sheet">
  <div id="shBar"></div>
  <input id="shTitle" placeholder="星の名前" autocapitalize="off" autocomplete="off">
  <button id="shMore">▾ この星のことを書く</button>
  <textarea id="shBody" rows="3" placeholder="この星のこと。"></textarea>
  <div id="shLinks"></div>
  <div id="shRow">
    <div id="shColors"></div>
    <button id="shDel">消す</button>
    <button id="shClose">閉じる</button>
  </div>
</div>

<div id="ask"><div id="askMsg"></div><div id="askBtns"><button id="askNo">やめる</button><button id="askYes">消す</button></div></div>
<div id="toast"></div>
<div id="dbg"></div>
<input type="file" id="file" accept=".json,application/json">

<div id="splash"><canvas id="spSky"></canvas><div id="spName">SOPHIA</div></div>

<script src="shared/sophia-core.js"></script>
<script src="shared/sophia-geometry.js"></script>
<script src="shared/sophia-sound.js"></script>
<script src="shared/sophia-star.js"></script>
<script src="shared/sophia-fx.js"></script>
<script src="shared/sophia-galaxy.js"></script>
<script src="shared/sophia-splash.js"></script>
<script src="shared/sophia-data.js"></script>
<script src="shared/sophia-license.js"></script>
<script>
(function(){
'use strict';
/* ===================== data ===================== */
const KEY='sophia-m-project';
const PALETTE=SOPHIA.PALETTE,PNAME=SOPHIA.PNAME,GRAY=SOPHIA.GRAY;   // shared/sophia-core.js
const FACES=4,FW=400,FH=780;                    // the universe: four faces, side by side, wrapping round
let title='無題のプロジェクト',groups=[],nodes=[],edges=[],memos=[],uid=1,gid=1,cid=1,mid=1;
const T0=performance.now();
function load(){
  try{const r=localStorage.getItem(KEY);if(!r)return false;const d=JSON.parse(r);
    title=d.title||title;groups=d.groups||[];nodes=d.nodes||[];edges=d.edges||[];memos=d.memos||[];
    uid=d.uid||1;gid=d.gid||1;cid=d.cid||1;mid=d.mid||1;return true;}catch(e){return false;}
}
function pack(){return{title:title,physics:false,groups:groups,nodes:nodes.map(strip),edges:edges,clusters:[],memos:memos,uid:uid,gid:gid,cid:cid,mid:mid};}
function strip(o){const c={};for(const k in o)if(k[0]!=='_')c[k]=o[k];return c;}
let quotaWarned=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(pack()));quotaWarned=false;}
  catch(e){if(!quotaWarned){quotaWarned=true;toast('保存領域がいっぱいです。「PCへ送る」で書き出してください');}}
}
const node=id=>nodes.find(n=>n.id===id);
const group=id=>groups.find(g=>g.id===id);
const colorOf=n=>{const g=group(n.group);return g?g.color:GRAY;};
const deg=id=>edges.reduce((k,e)=>k+(e.a===id||e.b===id?1:0),0);
const radius=n=>(9+Math.min(deg(n.id),8)*1.6)*(n.size||1);
function groupForColor(i){let g=groups.find(x=>x.color===PALETTE[i]);if(!g){g={id:gid++,name:PNAME[i],color:PALETTE[i]};groups.push(g);}return g;}
function fitToFaces(){                          // a PC project is laid across the four faces, shape kept
  if(!nodes.length)return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;nodes.forEach(n=>{x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y);});
  const bw=Math.max(x1-x0,1),bh=Math.max(y1-y0,1);
  const k=Math.min((FACES*FW-160)/bw,(FH-260)/bh);
  const ox=80+((FACES*FW-160)-bw*k)/2,oy=120+((FH-260)-bh*k)/2;
  nodes.forEach(n=>{n.x=ox+(n.x-x0)*k;n.y=oy+(n.y-y0)*k;});
}

/* ===================== ui helpers ===================== */
const $=id=>document.getElementById(id);
let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400);}
const esc=SOPHIA.text.esc,toText=SOPHIA.text.toText,toHtml=SOPHIA.text.toHtml;   // shared/sophia-core.js
function ask(msg,yes,yesLabel){$('askMsg').textContent=msg;$('askYes').textContent=yesLabel||'消す';$('ask').classList.add('open');
  $('askYes').onclick=()=>{$('ask').classList.remove('open');yes();};$('askNo').onclick=()=>$('ask').classList.remove('open');}
const CapN=(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())?window.Capacitor.Plugins:null;   // Capacitor の中でだけ非 null
const vib=ms=>{                                // 振動：ネイティブでは Haptics、ブラウザでは今までどおり
  if(CapN&&CapN.Haptics){
    const d=Array.isArray(ms)?ms.filter((v,i)=>i%2===0).reduce((a,b)=>a+b,0):ms;
    CapN.Haptics.vibrate({duration:d}).catch(()=>{});return;
  }
  if(navigator.vibrate)navigator.vibrate(ms);
};

/* ===================== sound (shared/sophia-sound.js) ===================== */
const Snd=SOPHIA.createSound();

/* ===================== sky: camera over four faces ===================== */
const cv=$('sky'),ctx=cv.getContext('2d');
let W_=0,H_=0,sc=1;                             // sc: one face fills the screen's width
let px=0,vy=0,pxT=0,vyT=0;                        // px: world x at the screen's left edge; vy: vertical offset (screen px)
function homeVy(){return Math.max(0,(H_-FH*sc)/2);}
function resize(){const d=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();W_=Math.round(r.width)||innerWidth;H_=Math.round(r.height)||innerHeight;
  cv.width=W_*d;cv.height=H_*d;ctx.setTransform(d,0,0,d,0,0);
  sc=(typeof overview!=='undefined'&&overview)?W_/WW():W_/FW;if(!sel&&!(typeof overview!=='undefined'&&overview)){vyT=vy=homeVy();}}
addEventListener('resize',resize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(cv);
const WW=()=>FACES*FW;
const S=p=>({x:(p.x-px)*sc,y:p.y*sc+vy});
const Wd=s=>({x:s.x/sc+px,y:(s.y-vy)/sc});
const wrapX=x=>((x%WW())+WW())%WW();
function faceOf(x){return Math.floor(wrapX(x)/FW);}
const hex=SOPHIA.hex,mixA=SOPHIA.mixA,shade=SOPHIA.shade,breathe=SOPHIA.breathe;   // shared/sophia-core.js

let nebulas=SOPHIA.galaxy.seedNebulas({count:22,nearCount:14,center:{x:800,y:390},along:2600,offNear:380,offFar:1400,rBase:120,rSpread:220});
function drawGalaxy(t){
  const cx=W_/2,cy=H_/2;
  for(const off of [-WW(),0,WW()])for(const nb of nebulas){const bx=(nb.x+off-px)*sc,by=nb.y*sc+vy,sx=(bx-cx)*nb.z+cx,sy=(by-cy)*nb.z+cy,rr=nb.r*sc*nb.z*1.6;
    if(sx<-rr||sx>W_+rr||sy<-rr||sy>H_+rr)continue;
    const a=nb.a*(0.75+0.25*Math.sin(t*nb.sp+nb.ph));const g=ctx.createRadialGradient(sx,sy,0,sx,sy,rr);
    g.addColorStop(0,'rgba('+nb.c[0]+','+nb.c[1]+','+nb.c[2]+','+a.toFixed(3)+')');g.addColorStop(1,'rgba('+nb.c[0]+','+nb.c[1]+','+nb.c[2]+',0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,rr,0,6.2832);ctx.fill();}
}
const mayaCurve=(p,q)=>SOPHIA.geo.mayaCurve(p,q,sc);                 // shared/sophia-geometry.js
const curveAt=SOPHIA.geo.curveAt;
const taper=(cu,ta,tb,w0,w1,colA,colB,glow,glowCol)=>
  SOPHIA.geo.taper(ctx,cu,ta,tb,w0,w1,colA,colB,glow,glowCol,18);
function drawStar(n,t,pX,pY,state){             // state: 0 plain, 1 chosen (held / in the sheet), 2 link target
  const grow=n._grow||0;
  const r=radius(n)*sc*(1+0.9*grow),c=colorOf(n),br=breathe(n,t);
  const fl=n._flare?Math.max(0,1-(t-n._flare)/520):0,lum=Math.min(1.35,0.46+0.54*br+0.6*fl+0.35*grow);
  let gc=group(n.group)?c:'#E4EBFA';if(state===1)gc='#F1DFA8';if(state===2)gc='#FFF4DC';   // the chosen star turns gold-white
  const G=r*(8.2+5.4*br+3*fl)*(state?1.25:1),DIM=state?1.0:0.84;
  SOPHIA.star.flare(ctx,pX,pY,r,gc,lum,G,DIM,1);   // shared/sophia-star.js
  if(state){ctx.strokeStyle=state===1?'rgba(216,181,101,.7)':'rgba(255,244,220,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(pX,pY,r+10,0,6.2832);ctx.stroke();}
  const fs=Math.max(11,12*Math.min(sc,1.25));ctx.font=fs+'px "Zen Kaku Gothic New",sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.save();
  const s=(n.title||'');const lines=[];let rest=s;while(rest.length&&lines.length<2){lines.push(rest.slice(0,12));rest=rest.slice(12);}
  if(rest.length&&lines.length)lines[lines.length-1]=lines[lines.length-1].slice(0,11)+'…';
  if(tidy){ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=state?'rgba(241,223,168,.95)':'rgba(233,227,211,.9)';
    ctx.fillText((s.length>11?s.slice(0,10)+'…':s)||'無題',pX+r+16,pY);
    ctx.font='9px "IBM Plex Mono",monospace';ctx.fillStyle='rgba(95,106,142,.9)';ctx.fillText(String((n._ti||0)+1),pX+r+16,pY+15);}
  else if(!overview){ctx.fillStyle=state?'rgba(241,223,168,.95)':'rgba(233,227,211,.86)';lines.forEach((L,i)=>ctx.fillText(L,pX,pY+r+8+i*fs*1.3));}
  ctx.restore();
}
let births=[],flashes=[],vanishes=[];
function spawnBirth(n){births.push(SOPHIA.fx.birth(n,performance.now()-T0));}
function drawBirth(B,t,pX,pY){                 // shared/sophia-fx.js
  if(!SOPHIA.fx.drawBirth(ctx,B,t,pX,pY,sc,colorOf(B.n),radius(B.n)*sc)){
    births=births.filter(x=>x!==B);return false;
  }
  return true;
}
function linkFlash(a,b){const t=performance.now()-T0;flashes.push({a:a,b:b,t0:t});const A=node(a),B=node(b);if(A)A._flare=t+260;if(B)B._flare=t+300;}
function vanishStars(ids){
  const set=new Set(ids),gone=nodes.filter(n=>set.has(n.id));if(!gone.length)return;
  vanishes.push(SOPHIA.fx.vanish(gone,colorOf,radius,performance.now()-T0));
  edges=edges.filter(e=>!set.has(e.a)&&!set.has(e.b));nodes=nodes.filter(n=>!set.has(n.id));
  if(sel&&set.has(sel.id))closeSheet();save();renderList();if(tidy)renderTidy();Snd.vanish();updateChrome();
}
function drawVanish(V,t){                      // shared/sophia-fx.js
  if(!SOPHIA.fx.drawVanish(ctx,V,t,f=>S({x:f.x+nearestOffset(f.x),y:f.y}),sc))
    vanishes=vanishes.filter(x=>x!==V);
}

let mode='capture',sel=null,held=null,linkFrom=null,linkTo=null,mouse={x:0,y:0},lastAct=performance.now();
function updateChrome(){                        // an empty universe shows nothing but the mark
  const g=nodes.length===0;
  if(g&&!document.body.classList.contains('genesis')){document.body.classList.add('genesis');if(mode!=='sky')setMode('sky');}
  else if(!g)document.body.classList.remove('genesis');
}
function nearestOffset(x){                      // the copy of a world x closest to the camera
  const cx=px+W_/(2*sc);let best=0,bd=1e9;for(const off of [-WW(),0,WW()]){const d=Math.abs(x+off-cx);if(d<bd){bd=d;best=off;}}return best;
}
function draw(){
  const t=performance.now()-T0;
  px+=(pxT-px)*0.18;vy+=(vyT-vy)*0.18;               // the camera glides: paging, or centring a chosen star
  if(Math.abs(pxT-px)<0.05)px=pxT;if(Math.abs(vyT-vy)<0.05)vy=vyT;
  {const w=wrapX(px);if(w!==px){const shift=w-px;px=w;pxT+=shift;if(pan)pan.px0+=shift;}}   // fold back after a lap
  for(const n of nodes){const g=(n===held||n===linkFrom)?1:0;n._grow=(n._grow||0)+(g-(n._grow||0))*0.28;
    const tx=(tidy&&n._tx!=null)?n._tx:n.x,ty=(tidy&&n._ty!=null)?n._ty:n.y;     // stars glide to the tidy grid and back
    if(n._dx==null){n._dx=n.x;n._dy=n.y;}
    n._dx+=(tx-n._dx)*0.14;n._dy+=(ty-n._dy)*0.14;
    if(Math.abs(tx-n._dx)<0.2&&Math.abs(ty-n._dy)<0.2){n._dx=tx;n._dy=ty;}}
  ctx.clearRect(0,0,W_,H_);
  drawGalaxy(t);
  if(mode==='sky'){
    const KZ=overview?0.42:Math.max(.7,Math.min(1.5,sc));
    for(const off of [-WW(),0,WW()]){
      for(const e of edges){const a=node(e.a),b=node(e.b);if(!a||!b)continue;
        const A=P(a),Bp=P(b);let bx=Bp.x;for(const o2 of [-WW(),WW()])if(Math.abs(Bp.x+o2-A.x)<Math.abs(bx-A.x))bx=Bp.x+o2;   // the nearer copy of b
        const p=S({x:A.x+off,y:A.y}),q=S({x:bx+off,y:Bp.y});
        if(Math.max(p.x,q.x)<-200||Math.min(p.x,q.x)>W_+200)continue;
        const cu=mayaCurve(p,q),shared=(breathe(a,t)+breathe(b,t))/2,lit=(sel&&(e.a===sel.id||e.b===sel.id));
        const F=flashes.find(f=>f.a===e.a&&f.b===e.b),fk=F?(t-F.t0)/460:1;
        const al=lit?0.95:0.42+0.3*shared+(F?0.4*(1-Math.min(1,fk)):0);
        taper(cu,0,1,(lit?6.6:5.2)*KZ,0.8*KZ,hex(colorOf(a),al),hex(colorOf(b),al*0.85),(lit?12:5+4*shared)*KZ,hex(colorOf(a),lit?.9:.45));
        if(F){if(fk>=1)flashes=flashes.filter(x=>x!==F);else{const pk=Math.min(1,fk/0.34),g3=curveAt(cu,pk);
          ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='rgba(255,240,210,.95)';ctx.shadowBlur=18;
          ctx.fillStyle='rgba(255,250,238,'+(pk<1?1:0)+')';ctx.beginPath();ctx.arc(g3.x,g3.y,3.6*KZ,0,6.2832);ctx.fill();
          if(pk>=1){const q2=Math.min(1,(fk-0.34)/0.66);ctx.strokeStyle='rgba(255,240,210,'+(0.75*Math.pow(1-q2,2)).toFixed(3)+')';ctx.lineWidth=1.2*(1-q2)+0.3;
            ctx.beginPath();ctx.arc(q.x,q.y,radius(b)*sc*(0.8+3.2*(1-Math.pow(1-q2,3))),0,6.2832);ctx.stroke();}
          ctx.restore();}}
      }
    }
    if(linkFrom){const LF=P(linkFrom),off=nearestOffset(LF.x),p=S({x:LF.x+off,y:LF.y});
      const tgt=linkTo?S({x:P(linkTo).x+nearestOffset(P(linkTo).x),y:P(linkTo).y}):mouse,cu=mayaCurve(p,tgt),ca=colorOf(linkFrom),cb=linkTo?colorOf(linkTo):ca;
      taper(cu,0,1,(linkTo?7:6)*KZ,(linkTo?1:1.6)*KZ,hex(ca,.95),hex(cb,linkTo?.95:.6),(linkTo?16:10)*KZ,hex(ca,.9));
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='rgba(255,240,210,.95)';ctx.shadowBlur=12;
      ctx.fillStyle='rgba(255,250,238,'+(linkTo?.55:.95)+')';ctx.beginPath();ctx.arc(mouse.x,mouse.y,3.2,0,6.2832);ctx.fill();ctx.restore();}
    for(const off of [-WW(),0,WW()])for(const n of nodes){const D=P(n),p=S({x:D.x+off,y:D.y});if(p.x<-160||p.x>W_+160||p.y<-160||p.y>H_+160)continue;
      const B=births.find(x=>x.n===n);if(!(B&&drawBirth(B,t,p.x,p.y)))drawStar(n,t,p.x,p.y,n===linkTo?2:((n===sel||n===held||n===linkFrom)?1:0));}
    for(const V of vanishes.slice())drawVanish(V,t);
    if(nodes.length===0){const idle=performance.now()-lastAct;if(idle>6000){const k=0.5-0.5*Math.cos((idle-6000)*0.0013);
      const g=ctx.createRadialGradient(W_/2,H_/2,0,W_/2,H_/2,70);g.addColorStop(0,'rgba(255,246,228,'+(0.16*k).toFixed(3)+')');g.addColorStop(1,'rgba(255,246,228,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(W_/2,H_/2,70,0,6.2832);ctx.fill();}}
    if(overview){                                // the four faces, side by side
      ctx.save();ctx.strokeStyle='rgba(216,197,150,.16)';ctx.lineWidth=1;ctx.font='12px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='top';
      for(let i=0;i<=FACES;i++){const x=(i*FW-px)*sc;ctx.beginPath();ctx.moveTo(x,vy);ctx.lineTo(x,vy+FH*sc);ctx.stroke();}
      ctx.beginPath();ctx.rect(-px*sc,vy,WW()*sc,FH*sc);ctx.stroke();
      ctx.fillStyle='rgba(216,197,150,.4)';for(let i=0;i<FACES;i++)ctx.fillText(['①','②','③','④'][i],(i*FW+FW/2-px)*sc,vy+8);
      ctx.restore();
    }
    const f=faceOf(px+W_/(2*sc));$('faces').querySelectorAll('i').forEach((el,i)=>el.classList.toggle('on',i===f));
  }else{
    for(const B of births.slice()){const p=S(B.n);drawBirth(B,t,p.x,p.y);}
    for(const V of vanishes.slice())drawVanish(V,t);
  }
  requestAnimationFrame(draw);
}

/* ===================== sky: touch ===================== */
function pick(sx,sy){
  const w=Wd({x:sx,y:sy});let best=null,bd=1e9;
  for(const off of [-WW(),0,WW()])for(const n of nodes){const D=P(n),d=Math.hypot(D.x+off-w.x,D.y-w.y),r=radius(n)+30/sc;if(d<=r&&d<bd){bd=d;best=n;}}
  return best;
}
let pan=null,tapT=0,tapP=null,edgeT=null,activeId=null;
let ptrs=new Map(),pinch=null,overview=false;
function enterOverview(){                       // pinch out: all four faces at once
  if(tidy)setTidy(false);overview=true;closeSheet();held=null;linkFrom=null;linkTo=null;pan=null;
  sc=W_/WW();px=pxT=0;vy=vyT=Math.max(0,(H_-FH*sc)/2);
  const h=$('skyHint');h.textContent='面をタップすると、そこへ。星をタップすると、その星へ';h.classList.add('on');
  clearTimeout(h._t);h._t=setTimeout(()=>h.classList.remove('on'),3000);vib(10);Snd.tick();
}
function exitOverview(face,star){
  overview=false;sc=W_/FW;
  const f=(face==null)?0:((face%FACES)+FACES)%FACES;
  px=pxT=f*FW;vy=vyT=homeVy();$('skyHint').classList.remove('on');
  if(star)setTimeout(()=>openSheet(star,false),60);
}
function snapPage(velocity){                    // settle on a face; a flick turns a page
  const f=px/FW;let target=Math.round(f);
  if(velocity<-0.35)target=Math.ceil(f);else if(velocity>0.35)target=Math.floor(f);
  pxT=target*FW;
}
cv.addEventListener('pointerdown',e=>{
  lastAct=performance.now();if(mode!=='sky')return;
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){                             // a second finger: everything else lets go, this is a pinch
    held=null;linkFrom=null;linkTo=null;pan=null;activeId=null;if(edgeT){clearTimeout(edgeT);edgeT=null;}
    const a=[...ptrs.values()];pinch={d0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),d:0};pinch.d=pinch.d0;return;}
  if(activeId!==null)return;
  activeId=e.pointerId;mouse={x:e.clientX,y:e.clientY};
  const h=pick(e.clientX,e.clientY);
  if(overview){pan={x:e.clientX,y:e.clientY,px0:px,lx:e.clientX,lt:performance.now(),v:0,moved:false,star:h};return;}
  if(tidy){pan={x:e.clientX,y:e.clientY,vy0:vy,moved:false,star:h};return;}
  if(h){held=h;held._sx=e.clientX;held._sy=e.clientY;vib(6);Snd.grab();}   // the star swells in the hand
  else pan={x:e.clientX,y:e.clientY,px0:px,vy0:vy,lx:e.clientX,lt:performance.now(),v:0,moved:false};
});
cv.addEventListener('pointermove',e=>{
  if(mode!=='sky')return;
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){if(ptrs.size>=2){const a=[...ptrs.values()];pinch.d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}return;}
  if(e.pointerId!==activeId)return;lastAct=performance.now();mouse={x:e.clientX,y:e.clientY};
  if(overview){if(pan&&Math.hypot(e.clientX-pan.x,e.clientY-pan.y)>10)pan.moved=true;return;}
  if(tidy){if(!pan)return;const dy=e.clientY-pan.y;if(Math.abs(dy)>6)pan.moved=true;
    const lo=Math.min(homeVy(),H_-(tidyRows*58+180)),hi=homeVy();vy=vyT=Math.max(lo,Math.min(hi,pan.vy0+dy));return;}
  if(held&&!linkFrom){if(Math.hypot(e.clientX-held._sx,e.clientY-held._sy)>6){linkFrom=held;held=null;}}
  if(linkFrom){
    const h=pick(e.clientX,e.clientY);const nt=(h&&h!==linkFrom)?h:null;if(nt!==linkTo){linkTo=nt;if(nt){Snd.tick();vib(8);}}
    const atR=e.clientX>W_-34,atL=e.clientX<34;   // holding the line at the screen's edge turns to the next face
    if((atR||atL)&&!edgeT)edgeT=setTimeout(()=>{edgeT=null;pxT=Math.round(pxT/FW)*FW+(atR?FW:-FW);vib(10);},380);
    else if(!atR&&!atL&&edgeT){clearTimeout(edgeT);edgeT=null;}
    return;
  }
  if(pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.hypot(dx,dy)>4&&!pan.moved){pan.moved=true;userPanned=true;cancelSettle();}  // a real pan wins over any pending re-centering
    const now=performance.now();pan.v=(e.clientX-pan.lx)/Math.max(1,now-pan.lt);pan.lx=e.clientX;pan.lt=now;
    px=pxT=pan.px0-dx/sc;
    if(sel)vy=vyT=pan.vy0+dy;}                 // with a star chosen, the sky moves up and down too — follows the finger directly, same as sideways
  if(pan&&pan.moved){const w=wrapX(px);if(w!==px){pan.px0+=w-px;px=pxT=w;}}
});
function endTouch(e){
  if(mode!=='sky')return;
  ptrs.delete(e.pointerId);
  if(pinch){
    if(ptrs.size<2){const grow=pinch.d-pinch.d0;pinch=null;
      if(!overview&&grow>40)enterOverview();else if(overview&&grow<-40)exitOverview(faceOf(px+W_/(2*sc)),null);}
    return;
  }
  if(e.pointerId!==activeId)return;activeId=null;
  if(edgeT){clearTimeout(edgeT);edgeT=null;}
  if(overview){const p=pan;pan=null;
    if(p&&!p.moved&&e.type==='pointerup'){const w=Wd({x:e.clientX,y:e.clientY});exitOverview(faceOf(w.x),p.star);Snd.tick();}
    return;}
  if(tidy){const p=pan;pan=null;if(p&&!p.moved&&e.type==='pointerup'&&p.star)openSheet(p.star,false);return;}
  if(linkFrom){
    const from=linkFrom;linkFrom=null;
    if(linkTo){const to=linkTo;linkTo=null;
      if(!edges.some(x=>(x.a===from.id&&x.b===to.id)||(x.a===to.id&&x.b===from.id))){edges.push({a:from.id,b:to.id});linkFlash(from.id,to.id);Snd.link();vib([8,30,12]);save();}}
    else{const p0=S({x:from.x+nearestOffset(from.x),y:from.y});
      if(e.type==='pointerup'&&Math.hypot(e.clientX-p0.x,e.clientY-p0.y)>90){   // let go in the void: a new star sprouts there
        const w=Wd({x:e.clientX,y:e.clientY});
        const sprout=()=>{if(nodes.indexOf(from)<0)return;
          const n={id:uid++,title:'新しい星',body:'',group:from.group,x:wrapX(w.x),y:Math.max(60,Math.min(FH-60,w.y)),cap:Date.now()};
          nodes.push(n);edges.push({a:from.id,b:n.id});spawnBirth(n);linkFlash(from.id,n.id);Snd.born();Snd.link();vib([8,30,12]);save();renderList();
          openSheet(n,true);};
        if(License.allows(nodes.length))sprout();else openBuy('wall',sprout);}}
    if(!sel)snapPage(0);return;
  }
  if(held){const n=held;held=null;if(e.type==='pointerup')openSheet(n,false);return;}
  if(pan){const p=pan;pan=null;
    if(p.moved){if(!sel)snapPage(p.v);return;}
    if(e.type!=='pointerup')return;
    const now=performance.now();
    if(tapP&&now-tapT<340&&Math.hypot(e.clientX-tapP.x,e.clientY-tapP.y)<30){tapT=0;tapP=null;
      const w=Wd({x:e.clientX,y:e.clientY});
      const born=()=>{const n={id:uid++,title:'新しい星',body:'',group:null,x:wrapX(w.x),y:Math.max(60,Math.min(FH-60,w.y)),cap:Date.now()};
        nodes.push(n);spawnBirth(n);Snd.born();vib(12);save();renderList();updateChrome();openSheet(n,true);};
      if(License.allows(nodes.length))born();else openBuy('wall',born);}
    else{tapT=now;tapP={x:e.clientX,y:e.clientY};if(sel)closeSheet();}
  }
}
cv.addEventListener('pointerup',endTouch);
cv.addEventListener('pointercancel',endTouch);
cv.addEventListener('lostpointercapture',e=>{ptrs.delete(e.pointerId);});

/* ===================== star sheet ===================== */
const SH=$('sheet'),SHT=$('shTitle'),SHB=$('shBody');
function sheetTop(){return SH.classList.contains('open')?SH.getBoundingClientRect().top:H_;}
let dbg=false;
function updateKbGap(){                         // iOS: the keyboard covers the bottom of the layout viewport
  const vv=window.visualViewport;
  const visBottom=vv?vv.offsetTop+vv.height:H_;   // the true bottom edge of what's actually visible
  SH.style.bottom=Math.max(0,H_-visBottom)+'px';  // pin the sheet's own bottom edge exactly there
  document.documentElement.style.setProperty('--vvTop',(vv?Math.round(vv.offsetTop):0)+'px');
}
let settleTimers=[],userPanned=false;           // once the user has panned by hand, nothing auto-recenters until a fresh star is chosen
function cancelSettle(){settleTimers.forEach(clearTimeout);settleTimers=[];}
function settleSheet(n){                        // the keyboard and the browser's own bars can take a while to settle
  userPanned=false;cancelSettle();
  settleTimers=[30,150,320,600,1000,1500].map(t=>setTimeout(()=>{updateKbGap();if(sel===n)centreOn(n);},t));
}
function centreOn(n){                           // the chosen star sits a hand's width above the sheet
  const off=nearestOffset(n.x);
  const vv=window.visualViewport;
  const visBottom=vv?vv.offsetTop+vv.height:H_;   // iOS: the keyboard shrinks what's visible, not the layout box
  const st=Math.min(sheetTop(),visBottom);
  const topBar=(parseFloat(getComputedStyle($('top')).paddingTop)||50)+44+(vv?vv.offsetTop:0); // fixed elements don't track the keyboard-scrolled visual viewport
  let ty=st-118;                                // the sheet is always on screen while you type; so is this

function storyText(){                           // the constellation read as a story: along the lines, then whatever is left
  const indeg={},out={};nodes.forEach(n=>{indeg[n.id]=0;out[n.id]=[];});
  edges.forEach(e=>{if(indeg[e.b]!=null&&out[e.a]){indeg[e.b]++;out[e.a].push(e.b);}});
  const byC=(a,b)=>((node(a).cap||0)-(node(b).cap||0))||(a-b);
  const q=created().filter(n=>indeg[n.id]===0).map(n=>n.id),order=[],seen=new Set();
  while(q.length){const id=q.shift();if(seen.has(id))continue;seen.add(id);order.push(id);
    out[id].slice().sort(byC).reverse().forEach(b=>{indeg[b]--;if(indeg[b]<=0)q.unshift(b);});}   // follow the line before moving on
  created().forEach(n=>{if(!seen.has(n.id)){seen.add(n.id);order.push(n.id);}});
  let t=title+'\n'+'—'.repeat(12)+'\n';
  order.forEach((id,i)=>{const n=node(id);t+='\n'+(i+1)+'. '+(n.title||'無題');const bt=toText(n.body);if(bt)t+='\n   '+bt.replace(/\n+/g,'\n   ');
    const nx=out[id].map(b=>node(b)).filter(Boolean).map(x=>x.title||'無題');if(nx.length)t+='\n   → '+nx.join(' / ');t+='\n';});
  t+='\n'+nodes.length+' の星 / '+edges.length+' の線\n';
  return t;
}

const License=SOPHIA.license;

const StoreIAP=(function(){                    // cordova-plugin-purchase（Capacitor の中でだけ動く）
  let ready=false,product=null,onOwned=null,started=false;
  const C=()=>window.CdvPurchase;
  const plat=()=>{const c=C();return (window.Capacitor&&window.Capacitor.getPlatform()==='android')?c.Platform.GOOGLE_PLAY:c.Platform.APPLE_APPSTORE;};
  function refresh(){
    const c=C();if(!c)return;const s=c.store;
    product=s.get(PRODUCT_ID,plat())||product;
    if(ready&&onOwned)onOwned(!!(product&&product.owned)||!!(s.owned&&s.owned(PRODUCT_ID)));
  }
  function start(){
    const c=C();if(!c||started)return;started=true;const s=c.store;
    s.register([{id:PRODUCT_ID,type:c.ProductType.NON_CONSUMABLE,platform:plat()}]);
    s.when().approved(t=>t.finish()).finished(refresh).productUpdated(refresh).receiptUpdated(refresh);
    s.initialize([plat()]).then(()=>{ready=true;refresh();});
  }
  return{
    init(cb){onOwned=cb;if(C())start();else document.addEventListener('deviceready',start,false);},
    price(){return product&&product.pricing&&product.pricing.price||null;},
    async buy(){
      const c=C();const offer=ready&&product&&product.getOffer&&product.getOffer();
      if(!offer)return 'unavailable';
      const err=await offer.order();
      if(!err)return 'ok';
      return err.code===c.ErrorCode.PAYMENT_CANCELLED?'cancel':'error';
    },
    async restore(){
      const c=C();if(!c||!ready)return 'unavailable';
      const err=await c.store.restorePurchases();refresh();
      if(err)return 'error';
      return License.isFull()?'ok':'none';
    }
  };
})();

  r.onload=()=>{try{const d=JSON.parse(r.result);
    ask('PCのプロジェクトを読み込みます。今スマホにある星と置き換えますが、よいですか？',()=>{
      const nd=SOPHIA.data.normalize(d);       // shared/sophia-data.js
      title=nd.title;groups=nd.groups;nodes=nd.nodes;edges=nd.edges;memos=nd.memos;
      uid=nd.uid;gid=nd.gid;cid=nd.cid;mid=nd.mid;
      nodes.forEach(n=>{delete n.vx;delete n.vy;});fitToFaces();save();renderList();updateChrome();$('ttl').textContent=title;toast('「'+title+'」を読み込みました');Snd.noteM();},'読み込む');
  }catch(err){toast('読み込めませんでした');}};
  r.readAsText(f);e.target.value='';
});

/* ===================== splash (shared/sophia-splash.js) ===================== */
(function(){
  SOPHIA.splash.paint($('spSky'),{
    x0:-0.2*innerWidth,y0:0.1*innerHeight,x1:1.1*innerWidth,y1:1.0*innerHeight,
    cloudN:140,cloudSpread:innerWidth*0.09,cloudR:[24,80],
    laneN:36,laneSpread:innerWidth*0.035,laneR:[16,40],
    dustSpread:innerWidth*0.12});
  const sp=$('splash');let done=false;function finish(){if(done)return;done=true;sp.classList.add('out');setTimeout(()=>sp.classList.add('gone'),650);}
  sp.addEventListener('pointerdown',finish);setTimeout(finish,2030);
})();

/* ===================== boot ===================== */
resize();load();$('ttl').textContent=title;renderList();
document.addEventListener('pointerdown',()=>{lastAct=performance.now();},{capture:true,passive:true});
setMode(nodes.length?'capture':'sky');updateChrome();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
